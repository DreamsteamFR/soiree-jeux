<script>
/* ===== CONFIGURATION : remplace par l'adresse de ta Realtime Database Firebase ===== */
var DB_URL='https://soiree-jeux-c4547-default-rtdb.europe-west1.firebasedatabase.app/';
var RAWG_KEY='cab7b79d8a674a309bade9f99f98d3f1'; /* facultatif : clé gratuite sur https://rawg.io/apidocs pour les suggestions de jeux */
/* ================================================================================== */
var configured=DB_URL.indexOf('VOTRE-PROJET')<0,hasRawg=RAWG_KEY.indexOf('VOTRE-CLE')<0,sugs=[],sugT=null,sugSeq=0,dragging=false,myRank=[],rkR=-1;
var joined=false,code='',room=null,created=false,status='',netErr=false,timer=null,lastSig='',syncing=false,chain=Promise.resolve(),lv={},lvR=-1,order=[],ordR=-1;

function ld(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function kid(s){var a=5381,b=52711;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);a=((a<<5)+a+c)|0;b=((b<<5)^b^c)|0}return'k'+(a>>>0).toString(36)+(b>>>0).toString(36)}
function arr(x){return Array.isArray(x)?x.filter(Boolean):Object.keys(x||{}).map(function(k){return x[k]})}
var app=document.getElementById('app');

function api(m,p,b){return fetch(DB_URL.replace(/\/$/,'')+p+'.json',{method:m,body:b===undefined?undefined:JSON.stringify(b)}).then(function(r){if(!r.ok){var e=new Error('http');e.status=r.status;throw e}return r.json()})}
function fail(e){netErr=true;status=(e&&(e.status===401||e.status===403))?'Accès refusé par la base de données : vérifie les règles Firebase.':'Connexion impossible. Vérifie ta connexion internet.';render()}
function rnd(){return room.round||0}
function plist(){var o=(room&&room.players)||{},kk=(room&&room.kicked)||{};return Object.keys(o).filter(function(id){return!kk[id]}).map(function(id){var p=o[id]||{};return{id:id,name:p.name||'?',games:arr(p.games).map(norm),votes:p.votes||{},done:!!p.done,round:p.round||0,rank:arr(p.rank),rdone:!!p.rdone,ready:!!p.ready,vo:arr(p.vo)}})}

function norm(g){return typeof g==='string'?{n:g}:g}
function gkey(g){return g.r?'r'+g.r:'t'+String(g.n).toLowerCase()}

function mcBadge(v,pre){var c=v>=75?'#66cc33':v>=50?'#ffcc33':'#ff5566';return'<span class="mc" style="background:'+c+'">'+(pre||'')+v+'</span>'}

function bgStyle(g){var h='hsl('+hue(g.k)+',62%,40%)';if(!g.img)return'background:'+h;return'background:linear-gradient(to top,rgba(10,6,40,.92),rgba(10,6,40,.1) 70%),url(\''+thumb(g.img,600,400)+'\') center/cover,'+h}
function pick(s){return{n:s.n,r:s.r,m:s.m,i:s.i,gn:s.gn,y:s.y}}
function addG(o){var m=mine();if(!m)return;var g=m.round===rnd()?m.games:[],k=gkey(o);if(g.some(function(x){return gkey(x)===k}))return;wr({games:g.concat([o]),ready:false})}
var curQ='',sugsR=[];

  var m=mine(),have={};((m&&m.round===rnd())?m.games:[]).forEach(function(x){have[gkey(x)]=1});

function fetchSugs(q){
  if(!hasRawg||q.length<2){++sugSeq;sugsR=[];mix(curQ);return}
  var t=++sugSeq;
  fetch('https://api.rawg.io/api/games?key='+encodeURIComponent(RAWG_KEY)+'&search='+encodeURIComponent(q)+'&page_size=6').then(function(r){return r.json()}).then(function(d){
    if(t!==sugSeq)return;
    sugsR=(d.results||[]).map(function(x){return{n:x.name,r:x.id,m:x.metacritic||null,i:x.background_image||null,y:(x.released||'').slice(0,4),gn:(x.genres||[]).slice(0,3).map(function(t){return t.name}).join(', ')}});mix(curQ);
  }).catch(function(){});
}
function drawSugs(){

var FRD={"Big Walk": "Retrouvez vos amis et perdez-vous dans un vaste monde. Un jeu coop en ligne de marche et communication par les devs d'Untitled Goose Game.", "BOMBANANA!": "Incarnez des singes démineurs entre amis ! Coopérez en équipe de trois singes : un aveugle, un sourd et un muet. Chaque joueur dispose d'une partie différente des informations. Communiquez, résolvez des casse-têtes et jouez contre la montre. Désamorcerez-vous les bombes avant qu'elles explosent ?", "How to Fish": "How to Fish est un simulateur de pêche pour 1 à 4 joueurs qui s'appuie sur règles de la physique. Alors que vous êtes tranquillement en train de siroter un verre sur votre bateau, vous vous écrasez sur une petite île. Pour pouvoir rentrer chez vous, vous allez devoir apprendre à pêcher.", "Valheim": "Un jeu multijoueur brutal d'exploration et de survie pour 1 à 10 joueurs, prenant place dans un purgatoire en génération procédurale inspiré par la culture viking. Combattez, bâtissez et accomplissez des exploits à la gloire d'Odin!", "RuneScape: Dragonwilds": "Sur le continent oublié d'Ashenfall, les dragons se sont éveillés. Récoltez, bâtissez, progressez et fabriquez tout ce qui vous plaira dans ce jeu de survie coopératif. Maîtrisez l'art de la survie et percez des secrets immémoriaux pour affronter la Reine des dragons.", "Active Matter": "Lancez-vous dans des raids d'extraction ou participez à des batailles en JcJ dans le multivers fracturé de ce jeu de tir militaire réaliste. Battez-vous dans des zones quantiques instables et emparez-vous de la matière active, capable de déformer le temps et l'espace.", "Aniimo": "Aniimo est un RPG en monde ouvert nouvelle génération de capture de créatures. Explorez un vaste continent, fusionnez avec des Aniimos uniques pour débloquer de nouvelles capacités, et rencontrez d'autres Nomades pour vivre des combats palpitants et percer les mystères de ce monde.", "Way of the Hunter 2": "Vivez l'aventure de chasse la plus réaliste dans les étendues sauvages d'Amérique du Nord et d'Afrique. Découvrez une faune impitoyable au comportement plus vrai que nature et des écosystèmes dynamiques tout en agrandissant votre collection de trophées dans votre gîte.", "NBA 2K27": "La quête est sans fin et l'action ne s'arrête jamais dans NBA 2K27. Poursuivez la gloire à tout moment dans MyCAREER, MyTEAM et MyNBA, et transformez vos rêves de basketball en réalité.", "EA SPORTS FC 27": "Découvrez The World's Game (le jeu Universel) dans EA SPORTS FC™ 27. Découvrez The Grounds, un terrain de jeu de football social où la rue se mêle au stade, et bénéficiez d'un meilleur contrôle dans chaque mode grâce aux innovations qui offrent un gameplay encore plus fidèle au football.", "OpenFront": "OpenFront est un jeu de battle royale PvP où des centaines de joueurs s'affrontent sur une immense carte, signant des alliances, amassant de l'or et déchaînant un enfer de frappes atomiques pour dominer le monde.", "Wand & Order: Tidy Up The Magic Shop": "Un simulateur douillet de rangement et de nettoyage coopératif à la première personne ! Triez baguettes, cartes de tarot et potions, puis remettez la boutique en ordre pour gagner des points et débloquer de puissants sortilèges qui vous aideront à rétablir l'ordre avant le retour de l'Alchimiste !", "The Lord of the Rings: War in the North": "Le Seigneur des anneaux : La Guerre du Nord – Édition Legacy étoffe le Légendarium de Tolkien en vous plongeant au cœur de l'histoire inédite et brutale d'Agandaûr, un Númenóréen Noir, et serviteur de Sauron, qui a rallié des forces colossales dans les ruines de Fornost.", "Gallipoli": "Débarquez sur les plages de Gallipoli et participez à des batailles à objectifs avec 50 joueurs sur les fronts ottomans ! Vivez l'expérience immersive des tranchées et des expéditions désertiques de la Première Guerre mondiale en incarnant une des 10 classes historiques aux armes authentiques.", "WheelMates": "Partez à deux dans une aventure de conduite avec des voitures télécommandées. Explorez le laboratoire du professeur, résolvez des énigmes, trouvez des passages cachés et découvrez ce qui s'y est passé. Avec le Pass ami, votre partenaire peut vous rejoindre gratuitement.", "Mimic Party": "Un jeu vocal en ligne, de 1 à 5 joueurs. Un son, une seule prise pour l'imiter tout le monde en même temps, sans tour de rôle. Ta prise est notée sur la hauteur et le rythme, puis la roue décide qui gagne un bonus et à qui on colle un pet. Tout le monde est ridicule, c'est le principe.", "Far Far West": "Yee-haw, Cowboys ! Faites équipe dans ce jeu de tir coop à 4 joueurs. Voyagez dans le 'Far Far West' pour éliminer des monstres, lancer des sorts, compléter des missions et collecter des primes. Travaillez en équipe pour entrer, être payé et vous en sortir (en grande partie) vivant.", "Palworld": "Un tout nouveau jeu de survie multijoueur en monde ouvert où le but est de collectionner de mystérieuses créatures, les Pals, afin de les faire combattre, bâtir des structures, travailler dans les champs et faire tourner vos usines.", "LEGO Batman: Legacy of the Dark Knight": "Deviens le Chevalier noir et vis l'histoire mythique de Batman dans une aventure pleine d'action et de combats acharnés. Explore Gotham City en monde ouvert dans le style LEGO bien connu et apprécié des fans.", "Shift At Midnight": "Jeu d'horreur coopératif en ligne pouvant réunir jusqu'à 3 joueurs. Travaillez en équipe au cours de nuits générées aléatoirement pour enquêter sur vos clients, dont certains ne sont pas réellement humains. Une erreur, et il vous faudra vous barricader, poser des pièges et vous cacher.", "Cat Mail Co.": "Dirigez la poste de l'île de chats. Triez et distribuez les colis qui arrivent chaque jour du bateau, organisez tout à votre façon. La nuit venue, la lune dévoile des secrets cachés sur les colis. Venez à bout d'une mystérieuse pile de colis et débloquez de nouvelles capacités et destinations.", "Subnautica 2": "Subnautica 2 est un jeu d'aventure et de survie sous-marine dans un monde océanique inédit, développé par Unknown Worlds. Jouez en solo ou jusqu'à 4 joueurs en coop. Adaptez-vous pour survivre en construisant des bases et des outils. Explorez l'inconnu et découvrez les mystères des profondeurs.", "Absolum": "Incarnez les héros exclus de Talamh et rejoignez un combat sans pitié pour arracher la magie des griffes du Roi Soleil Azra dans Absolum, un beat 'em up roguelite original par Dotemu.", "Escape Simulator 2": "La suite du jeu d'évasion le plus vendu, apporte une nouvelle approche des puzzles à la première personne avec une variété de nouvelles salles à explorer en solo ou avec des amis. Résolvez des énigmes complexes, découvrez des secrets cachés ou créez vos propres salles d'évasion avec Room Editor 2.0.", "PowerWash Simulator 2": "PowerWash Simulator revient avec des missions de nettoyage, des pièces d'équipement et des fonctionnalités flambant neuves. Transformez des environnements encrassés en des paysages immaculés et sereins, en solo ou avec des amis. Il est temps de relâcher la pression !", "RV There Yet?": "Un jeu d'aventure coopératif qui vous met au défi de conduire votre caravane jusqu'à votre domicile !", "Tears of Metal": "Tears of Metal est un roguelike médiéval co-op de type hack-and-slash. Combattez des hordes d'ennemis pour reconquérir votre île avec l'aide de votre redoutable bataillon écossais. En vous enfonçant dans les tranchées, découvrez les mystères du Météore du Dragon et l'invasion ennemie perfide.", "Machine Party": "Machine Party consiste en un ensemble de mini-jeux violents, jouables à plusieurs, et où tout échec vous est fatal.", "Windrose": "Embarquez dans une aventure de survie JcE dans l'âge des pirates. Combattez à terre et en mer, en solo ou entre amis. Construisez, fabriquez, explorez un vaste monde et découvrez ses secrets. Avec un gameplay « Souls » approchable, défiez des boss redoutables, naviguez et pillez des trésors !", "Gamble With Your Friends": "Un jeu en ligne coop de type casino de 1 à 6 joueurs où vous et vos amis partagez un portefeuille et une dette colossale. Pariez, achetez des objets douteux, prenez d'atroces décisions et grimpez la tour pour rembourser votre quota quotidien en 5 minutes, ou subissez les conséquences de votre échec.", "Escape the Backrooms": "Escape the Backrooms est un jeu d'exploration et d'horreur jouable de 1 à 4 en coop. Traversez plus de 30 étages inquiétants tout en évitant les entités et autres dangers. Essayez de vous enfuir, mais sachez ceci : votre survie n'est pas garantie.", "Where Winds Meet": "Where Winds Meet est un RPG d'action-aventure en monde ouvert, épique et profondément enraciné dans l'héritage du Wuxia.", "Heroes of Might and Magic: Olden Era": "Heroes of Might and Magic: Olden Era est la préquelle d'une série de jeux de stratégie au tour par tour qui a donné au genre ses lettres de noblesse. Levez de grandes armées et lancez des sorts dévastateurs pour vaincre vos ennemis en solo ou en multijoueur.", "Avatar Legends: The Fighting Game": "Maîtrisez les éléments et affrontez des personnages légendaires dans Avatar Legends: The Fighting Game. Dans ce jeu doté d'une animation en 2D dessinée à la main et fidèle aux origines de la série, vous pourrez faire l'expérience du monde d'Avatar de toutes les façons imaginables.", "Marathon": "Explorez la colonie perdue de Tau Ceti IV et pillez des objets de valeur dans ce jeu de tir et de survie à la première personne aux enjeux élevés par les créateurs de Halo et Destiny.", "Forza Horizon 6": "Découvrez les paysages à couper le souffle du Japon au volant de plus de 550 voitures réelles et devenez une légende de la course automobile dans la plus grande aventure motorisée Forza Horizon à ce jour."};

  api('PUT','/rooms/'+code+'/kicked/'+id,true).then(function(){return api('DELETE','/rooms/'+code+'/players/'+id)}).then(function(){
    room.kicked=room.kicked||{};room.kicked[id]=true;if(room.players)delete room.players[id];refresh();autoStart();poll()}).catch(fail);
}
function inviteUrl(){return location.href.split('#')[0].split('?')[0]+'?code='+code}
function copyInvite(btn){
  var u=inviteUrl();
  function ok(){btn.textContent='Lien copié ✓';setTimeout(function(){if(btn.isConnected)btn.textContent='🔗 Copier le lien d’invitation'},2000)}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(ok,function(){window.prompt('Copie ce lien :',u)});
  else window.prompt('Copie ce lien :',u);
}
function curVotes(m){var v=Object.assign({},m.votes,lv);Object.keys(lvDel).forEach(function(k){delete v[k]});return v}
function undoHtml(){return myVO.length?'<div class="undoRow"><button class="ghost" id="undo">↶ Annuler mon dernier vote</button></div>':''}
function undoVote(m){
  if(!myVO.length)return;var id=myVO.pop();
  delete lv[id];lvDel[id]=1;
  var vs=curVotes(m),snap=Object.assign({},vs),vo=myVO.slice();
  var oi=order.indexOf(id);if(oi>=0)order.splice(oi,1);
  var fi=order.findIndex(function(k){return!(k in vs)});order.splice(fi<0?order.length:fi,0,id);
  sfx('tick');chain=chain.then(function(){return wr({votes:snap,done:false,vo:vo})});render();
}

try{localStorage.removeItem('sj3-hist')}catch(e){}
render();
(function(){var c=ld('sj3-code');if(configured&&c&&me.name&&(!pendCode||pendCode===c))enter(c,false)})();
</script>
