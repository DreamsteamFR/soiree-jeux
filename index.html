<style>

h1{font-size:3rem;line-height:.98;margin:8px 0 12px;font-weight:800;letter-spacing:-.035em;background:linear-gradient(135deg,#fff,#c3b5ff 55%,#7ee7f7);-webkit-background-clip:text;background-clip:text;color:transparent}

.acts{display:flex;justify-content:center;gap:18px}

.rk{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:8px}
.pos{font-weight:800;width:1.6em;color:var(--acc2)}.rn{flex:1;font-weight:600;overflow-wrap:anywhere}.rk button{padding:6px 12px}
.attr{max-width:480px;margin:0 auto;padding:0 20px 32px;font-size:.85rem;color:var(--mute)}.attr a{color:var(--acc2)}

.shell{max-width:none}
#tr{display:none}

.trh button{padding:6px 12px}
.cat{background:var(--card);border:1.5px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
.cath{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;color:var(--ink);border-radius:0;padding:13px 16px;font-weight:700}
.cath span:first-child{flex:1}.cath small{color:var(--mute);font-weight:600}.chev{color:var(--acc2)}
.catb{padding:0 12px 12px}.cd{font-size:.85rem;margin:0 4px 10px}
.ctl{display:flex;gap:8px;margin-bottom:10px}
.ctl select{flex:1;min-width:0;font:inherit;font-size:.9rem;color:var(--ink);background:#181633;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.ctl select:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.tc{display:flex;gap:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px}
.ti{width:104px;height:64px;flex:none;border-radius:10px;background-color:#2a2650;background-size:cover;background-position:center}
.tb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tb b{font-size:.98rem;line-height:1.15;overflow-wrap:anywhere}.tb small{color:var(--mute);font-size:.8rem}
.tf{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px}
.tf button{padding:5px 12px;font-size:.85rem;margin-left:auto}
.tf button:disabled{opacity:1;background:rgba(43,229,154,.15);color:var(--yes);border:1px solid var(--yes)}
.more{width:100%;margin-top:4px;padding:9px}
#trfab{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:10;box-shadow:0 10px 30px -6px rgba(139,108,255,.7);border-radius:999px;padding:13px 22px;white-space:nowrap}
#trbk{display:none}
@media(min-width:960px){
  .shell.with-tr{display:grid;grid-template-columns:400px 480px;justify-content:center;gap:28px}
  .with-tr #tr{position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 6px 36px 4px;scrollbar-width:thin}
  #trfab,#trx{display:none!important}
}
@media(max-width:959px){
  .with-tr #tr{position:fixed;left:0;right:0;bottom:0;top:7vh;z-index:30;background:#100e24;border-radius:24px 24px 0 0;border:1.5px solid var(--line);overflow-y:auto;padding:16px 14px calc(30px + env(safe-area-inset-bottom,0px));transform:translateY(105%);visibility:hidden;transition:transform .28s,visibility 0s .28s;box-shadow:0 -20px 60px rgba(0,0,0,.6)}
  .with-tr #tr.open{transform:none;visibility:visible;transition:transform .28s}
  #trbk.show{display:block;position:fixed;inset:0;z-index:20;background:rgba(5,4,15,.6)}
  main{padding-bottom:90px}
}
</style>

<body>
<div class="shell" id="shell"><aside id="tr" aria-label="Jeux multi du moment"></aside><main id="app"></main></div>
<div id="trbk"></div><button id="trfab" hidden>🔥 Jeux du moment</button>
<footer class="attr">Données des jeux : <a href="https://rawg.io" target="_blank" rel="noopener">RAWG</a> (scores Metacritic inclus)</footer>
<script>
/* ===== CONFIGURATION : remplace par l'adresse de ta Realtime Database Firebase ===== */
var DB_URL='https://soiree-jeux-c4547-default-rtdb.europe-west1.firebasedatabase.app/';
var RAWG_KEY='cab7b79d8a674a309bade9f99f98d3f1'; /* facultatif : clé gratuite sur https://rawg.io/apidocs pour les suggestions de jeux */
/* ================================================================================== */
var configured=DB_URL.indexOf('VOTRE-PROJET')<0,hasRawg=RAWG_KEY.indexOf('VOTRE-CLE')<0,sugs=[],sugT=null,sugSeq=0,dragging=false,myRank=[],rkR=-1;
var joined=false,code='',room=null,created=false,status='',netErr=false,timer=null,lastSig='',syncing=false,chain=Promise.resolve(),lv={},lvR=-1,order=[],ordR=-1;
var me=ld('sj3-me')||{id:Math.random().toString(36).slice(2,10),name:''};
function ld(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function kid(s){var a=5381,b=52711;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);a=((a<<5)+a+c)|0;b=((b<<5)^b^c)|0}return'k'+(a>>>0).toString(36)+(b>>>0).toString(36)}
function arr(x){return Array.isArray(x)?x.filter(Boolean):Object.keys(x||{}).map(function(k){return x[k]})}
var app=document.getElementById('app');

function api(m,p,b){return fetch(DB_URL.replace(/\/$/,'')+p+'.json',{method:m,body:b===undefined?undefined:JSON.stringify(b)}).then(function(r){if(!r.ok){var e=new Error('http');e.status=r.status;throw e}return r.json()})}
function fail(e){netErr=true;status=(e&&(e.status===401||e.status===403))?'Accès refusé par la base de données : vérifie les règles Firebase.':'Connexion impossible. Vérifie ta connexion internet.';render()}
function rnd(){return room.round||0}
function plist(){var o=(room&&room.players)||{};return Object.keys(o).map(function(id){var p=o[id]||{};return{id:id,name:p.name||'?',games:arr(p.games).map(norm),votes:p.votes||{},done:!!p.done,round:p.round||0,rank:arr(p.rank),rdone:!!p.rdone,ready:!!p.ready}})}
function cur(){return room?plist().filter(function(p){return p.round===rnd()}):[]}
function mine(){return plist().filter(function(p){return p.id===me.id})[0]}
function norm(g){return typeof g==='string'?{n:g}:g}
function gkey(g){return g.r?'r'+g.r:'t'+String(g.n).toLowerCase()}
function pool(){var m={};cur().forEach(function(p){p.games.forEach(function(g){var k=gkey(g),e=m[k]=m[k]||{k:k,id:kid(k),name:g.n,r:null,mc:null,img:null,gn:null,y:null,by:[]};e.r=e.r||g.r||null;e.mc=e.mc||g.m||null;e.img=e.img||g.i||null;e.gn=e.gn||g.gn||null;e.y=e.y||g.y||null;e.by.push(p.name)})});return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return a.k<b.k?-1:1})}
function mcBadge(v,pre){var c=v>=75?'#66cc33':v>=50?'#ffcc33':'#ff5566';return'<span class="mc" style="background:'+c+'">'+(pre||'')+v+'</span>'}
function thumb(u,w,h){return String(u).replace('/media/games/','/media/crop/'+w+'/'+h+'/games/').replace(/["\'<>\s]/g,'')}
function bgStyle(g){var h='hsl('+hue(g.k)+',62%,40%)';if(!g.img)return'background:'+h;return'background:linear-gradient(to top,rgba(10,6,40,.92),rgba(10,6,40,.1) 70%),url(\''+thumb(g.img,600,400)+'\') center/cover,'+h}
function pick(s){return{n:s.n,r:s.r,m:s.m,i:s.i,gn:s.gn,y:s.y}}
function addG(o){var m=mine();if(!m)return;var g=m.round===rnd()?m.games:[],k=gkey(o);if(g.some(function(x){return gkey(x)===k}))return;wr({games:g.concat([o]),ready:false})}
/*H*/
var curQ='',sugsR=[],histSaved='';
function hLoad(){var h=ld('sj3-hist');return Array.isArray(h)?h:[]}
function hSave(games){var h=hLoad(),idx={};h.forEach(function(e){idx[gkey(e)]=e});
  games.forEach(function(g){var k=gkey(g),e=idx[k];if(!e){e={n:g.n,c:0};h.push(e);idx[k]=e}
    e.c=(e.c||0)+1;e.t=Date.now();e.n=g.n;if(g.r)e.r=g.r;if(g.m)e.m=g.m;if(g.i)e.i=g.i;if(g.gn)e.gn=g.gn;if(g.y)e.y=g.y});
  h.sort(function(a,b){return(b.t||0)-(a.t||0)});sv('sj3-hist',h.slice(0,300))}
function histCheck(){if(!room||room.phase!=='swipe')return;var m=mine(),k=code+':'+rnd();
  if(m&&m.round===rnd()&&histSaved!==k&&m.games.length){histSaved=k;hSave(m.games)}}
function mix(q){
  var m=mine(),have={};((m&&m.round===rnd())?m.games:[]).forEach(function(x){have[gkey(x)]=1});
  var ql=q.toLowerCase(),h=hLoad().filter(function(e){return!have[gkey(e)]&&(!ql||e.n.toLowerCase().indexOf(ql)>=0)});
  if(!ql)h.sort(function(a,b){return(b.c||0)-(a.c||0)||(b.t||0)-(a.t||0)});
  var loc=h.slice(0,ql?4:6).map(function(e){return Object.assign({h:1},e)}),seen={};loc.forEach(function(e){seen[gkey(e)]=1});
  sugs=loc.concat(sugsR.filter(function(x){var k=gkey(x);return!seen[k]&&!have[k]}));
  drawSugs()}
/*Hend*/
function fetchSugs(q){
  if(!hasRawg||q.length<2){++sugSeq;sugsR=[];mix(curQ);return}
  var t=++sugSeq;
  fetch('https://api.rawg.io/api/games?key='+encodeURIComponent(RAWG_KEY)+'&search='+encodeURIComponent(q)+'&page_size=6').then(function(r){return r.json()}).then(function(d){
    if(t!==sugSeq)return;
    sugsR=(d.results||[]).map(function(x){return{n:x.name,r:x.id,m:x.metacritic||null,i:x.background_image||null,y:(x.released||'').slice(0,4),gn:(x.genres||[]).slice(0,3).map(function(t){return t.name}).join(', ')}});mix(curQ);
  }).catch(function(){});
}
function drawSugs(){
  var el=document.getElementById('sg');if(!el)return;
  el.innerHTML=sugs.map(function(s,i){return'<button class="sug" data-s="'+i+'">'+(s.i?'<img src="'+thumb(s.i,160,90)+'" alt="">':'<span class="ph"></span>')+'<span class="sn">'+esc(s.n)+'<small>'+esc(s.h?'🕘 déjà proposé'+(s.c>1?' '+s.c+' fois':''):[s.y,s.gn].filter(Boolean).join(' · '))+'</small></span>'+(s.m?mcBadge(s.m):'')+'</button>'}).join('');
  el.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){var s=sugs[+b.dataset.s];curQ='';sugsR=[];document.getElementById('g').value='';mix('');addG(pick(s))}});
}
function sig(){if(!room)return'';var c=cur();return JSON.stringify(room.phase==='swipe'?['s',rnd(),c.map(function(p){return[p.id,p.done,p.rdone]}),!!mine(),matches().map(function(g){return g.id})]:['g',rnd(),c.map(function(p){return[p.id,p.name,p.games,p.ready]}),!!mine()])}
function refresh(){if(dragging)return;matchCheck();var s=sig();if(s!==lastSig){lastSig=s;render()}}
function wr(patch){
  var m=mine()||{games:[],votes:{},done:false,round:rnd(),rank:[],rdone:false,ready:false};
  var d={name:me.name,games:m.games,votes:m.votes,done:m.done,round:m.round,rank:m.rank,rdone:m.rdone,ready:m.ready};for(var k in patch)d[k]=patch[k];
  return api('PUT','/rooms/'+code+'/players/'+me.id,d).then(function(){room.players=room.players||{};room.players[me.id]=d;refresh();autoStart()}).catch(fail);
}
function sync(){
  if(!room||syncing)return;var m=mine();
  if(m&&m.round===rnd())return;
  if(!m&&room.phase!=='games')return;
  syncing=true;wr({games:m?m.games:[],votes:{},done:false,round:rnd(),rank:[],rdone:false,ready:false}).then(function(){syncing=false},function(){syncing=false});
}
function poll(){
  if(!joined)return;
  api('GET','/rooms/'+code).then(function(d){
    if(!joined)return;
    if(d===null){if(!created){leave('Code inconnu : '+code);jm=true;render()}return}
    room=d;created=true;
    if(netErr){netErr=false;status=''}
    if(room.phase==='swipe'&&lastPh==='games')sfx('go');lastPh=room.phase;histCheck();sync();refresh();autoStart();
  }).catch(fail);

    var u=trU(c.k),all=trData[c.k]||[],gset={};
    all.forEach(function(x){x.gs.forEach(function(g){gset[g]=1})});
    var gl=Object.keys(gset).sort(function(a,b){return a.localeCompare(b,'fr')});
    if(u.genre&&!gset[u.genre])u.genre='';
    var l=all.filter(function(x){return!u.genre||x.gs.indexOf(u.genre)>=0});
    if(u.sort==='mc')l.sort(function(a,b){return(b.m||-1)-(a.m||-1)||a.o-b.o});
    else if(u.sort==='az')l.sort(function(a,b){return a.n.localeCompare(b.n,'fr')});
    else if(u.sort==='rec')l.sort(function(a,b){return b.rel<a.rel?-1:b.rel>a.rel?1:a.o-b.o});
    else l.sort(function(a,b){return a.o-b.o});
    var shown=u.more?l:l.slice(0,12);
    h+='<section class="cat"><button class="cath" data-h="'+c.k+'" aria-expanded="'+(!u.hide)+'"><span>'+esc(c.t)+'</span><small>'+all.length+'</small><span class="chev">'+(u.hide?'▸':'▾')+'</span></button>';
    if(!u.hide){
      h+='<div class="catb"><p class="cd">'+esc(c.d)+'</p><div class="ctl">'+
        (gl.length?'<select data-g="'+c.k+'" aria-label="Filtrer par genre"><option value="">Tous les genres</option>'+gl.map(function(g){return'<option value="'+esc(g)+'"'+(u.genre===g?' selected':'')+'>'+esc(g)+'</option>'}).join('')+'</select>':'')+
        '<select data-s="'+c.k+'" aria-label="Trier">'+[['pop','Popularité'],['mc','Score Metacritic'],['az','Ordre alphabétique'],['rec','Plus récents']].map(function(o){return'<option value="'+o[0]+'"'+(u.sort===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></div>';
      if(!shown.length)h+='<p>Aucun jeu ne correspond.</p>';
      shown.forEach(function(x){
        var added=have['r'+x.r]||have['t'+x.n.toLowerCase()];
        h+='<div class="tc"><div class="ti"'+(x.i?' style="background-image:url(\''+thumb(x.i,320,180).replace(/[()]/g,'')+'\')"':'')+'></div><div class="tb"><b>'+esc(x.n)+'</b><small>'+esc(x.gs.slice(0,2).join(', ')||'Jeu multijoueur')+(x.y?' · '+esc(x.y):'')+'</small><div class="tf">'+(x.m?mcBadge(x.m):'')+
          '<button data-a="'+c.k+':'+x.r+'"'+(added?' disabled':'')+'>'+(added?'Ajouté ✓':'Ajouter au pool')+'</button></div></div></div>'});
      if(l.length>12)h+='<button class="ghost more" data-m="'+c.k+'">'+(u.more?'Voir moins':'Voir plus ('+(l.length-12)+')')+'</button>';
      h+='</div>'}
    h+='</section>'});
  tr.innerHTML=h;tr.scrollTop=st;
  function sv2(){sv('sj3-tr-ui',trUI);trSig='';trSync()}
  var x=document.getElementById('trx');if(x)x.onclick=trClose;
  x=document.getElementById('trr');if(x)x.onclick=function(){trErr='';trVer++;trSync()};
  tr.querySelectorAll('[data-h]').forEach(function(b){b.onclick=function(){var u=trU(b.dataset.h);u.hide=!u.hide;sv2()}});
  tr.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){var u=trU(b.dataset.m);u.more=!u.more;sv2()}});
  tr.querySelectorAll('[data-g]').forEach(function(b){b.onchange=function(){trU(b.dataset.g).genre=b.value;sv2()}});
  tr.querySelectorAll('[data-s]').forEach(function(b){b.onchange=function(){trU(b.dataset.s).sort=b.value;sv2()}});
  tr.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){
    var p=b.dataset.a.split(':'),it=(trData[p[0]]||[]).filter(function(z){return String(z.r)===p[1]})[0];if(!it)return;
    sfx('tick');addG({n:it.n,r:it.r,m:it.m,i:it.i,gn:it.gs.slice(0,3).join(', '),y:it.y})}});
}
document.getElementById('trfab').onclick=trOpen;
document.getElementById('trbk').onclick=trClose;
document.addEventListener('keydown',function(e){if(e.key==='Escape')trClose()});

render();
(function(){var c=ld('sj3-code');if(configured&&c&&me.name)enter(c,false)})();
</script>
